// Standalone build that compiles junit4's main sources with NullAway, so NullAway and
// NullAwayAnnotator can be run on junit4 without changing junit4's own (Java 5, Maven) build.
// See README.md in this directory.

import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java'
    id "net.ltgt.errorprone" version "5.1.0"
}

repositories {
    mavenLocal()      // annotator-scanner published from this repository
    mavenCentral()
}

// junit4 sources to analyze (-PsrcDir=/path/to/junit4/src/main/java)
def srcDir = project.findProperty("srcDir") ?: "/Users/mushfiqurrahmanchowdhury/Documents/junit4/src/main/java"

// Set by run-annotator.sh (-Pannotator=true): turns on what NullAwayAnnotator needs
def annotatorMode = project.hasProperty("annotator")
def annotatorVersion = project.findProperty("annotatorVersion") ?: "1.3.20-SNAPSHOT"
def annotatorOut = "${projectDir}/annotator-out"

// Compile (and run Error Prone/NullAway) with JDK 21, whatever JDK Gradle itself runs on
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

sourceSets { main { java { srcDirs = [srcDir] } } }

dependencies {
    implementation "org.hamcrest:hamcrest-core:1.3"           // junit4's only compile dependency
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"       // javax.annotation.Nullable
    compileOnly "org.jspecify:jspecify:1.0.1"                 // NullUnmarked
    compileOnly "com.uber.nullaway:nullaway-annotations:0.14.1" // Initializer
    errorprone "com.uber.nullaway:nullaway:0.14.1"
    errorprone "com.google.errorprone:error_prone_core:2.42.0"
    if (annotatorMode) {
        errorprone "edu.ucr.cs.riple.annotator:annotator-scanner:${annotatorVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "ISO-8859-1"   // same as junit4's pom.xml
    options.release = 21
    // NullAway reports errors, so the build is expected to FAIL while NullAway finds problems.
    options.errorprone {
        check("NullAway", CheckSeverity.ERROR)
        option("NullAway:AnnotatedPackages", "org.junit,junit")
        if (annotatorMode) {
            check("AnnotatorScanner", CheckSeverity.ERROR)
            option("NullAway:SerializeFixMetadata", "true")
            option("NullAway:FixSerializationConfigPath", "${annotatorOut}/nullaway.xml")
            option("AnnotatorScanner:ConfigPath", "${annotatorOut}/scanner.xml")
        }
    }
    options.compilerArgs += ["-Xmaxwarns", "100000", "-Xmaxerrs", "100000"]
    // Diagnostic: print the JDK and Error Prone arguments so the setup can be checked in the output
    doFirst {
        println "JDK used for compilation: " + javaCompiler.get().metadata.installationPath
        println "Error Prone args: " + options.compilerArgumentProviders.collectMany { it.asArguments() }.join(" ")
    }
}
